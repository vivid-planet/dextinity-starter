name: i18n

on:
  push:
    branches:
      - main

# Admin and Site commit to the same translation repository in sequence, so aborting a run
# leaves it out of sync until the next push to main: queue the next run instead of cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ github.actor }}"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm --prefix admin ci && npm --prefix site ci

      - name: Clone translations
        uses: actions/checkout@v7
        with:
          repository: vivid-planet/dextinity-starter-lang
          token: ${{ secrets.VIVID_PLANET_BOT_TOKEN }}
          path: "lang/starter-lang"

      - name: "Admin: Extract i18n strings"
        run: |
          npm --prefix admin run intl:extract
          cp admin/lang-extracted/en.json lang/starter-lang/admin/en.json

      - name: "Site: Extract i18n strings"
        run: |
          npm --prefix site run intl:extract
          cp site/lang-extracted/en.json lang/starter-lang/site/en.json

      - name: Update translatable strings
        uses: EndBug/add-and-commit@v11
        with:
          cwd: "./lang/starter-lang"
          message: "Commit from GitHub Actions (i18n)"
